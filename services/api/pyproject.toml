[project]
name = "harrier-api"
version = "0.1.0"
description = "Harrier domain, API service, and CLI"
license = "MIT"
license-files = ["../../LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # Form parsing for the capture confirmation page. The bookmarklet itself
    # carries no token: the page the GET renders holds it in a hidden field
    # and posts it (spec 035, proven by
    # tests/test_batch_and_capture.py::test_the_confirmation_page_carries_the_fields_and_the_token).
    "python-multipart>=0.0.9",
]

[project.scripts]
harrier = "harrier_cli.main:main"

[dependency-groups]
# PDF rendering is optional: install with `uv sync --group pdf`, then
# `uv run playwright install chromium`. Page-count validation also uses
# the pdfinfo binary (poppler). Without them, `harrier tailor` fails
# with an actionable error and the tracker row is never touched.
pdf = [
    "playwright>=1.40",
]
# Gmail polling is optional: install with `uv sync --group gmail`.
gmail = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "import-linter>=2.0",
    "httpx>=0.28",
    # Fits the learned fit score offline (`harrier scoring train`, spec 077)
    # and proves in CI that plain-Python inference reproduces it. Dev only:
    # the image installs --no-dev, and an import-linter contract below keeps
    # sklearn and numpy off every path except the trainer.
    "scikit-learn>=1.9.1",
    # The Postgres store's tests run in CI and wherever a test server is
    # named (spec 103, tests/pg_support.py).
    {include-group = "postgres"},
]
# The hosted Postgres store is optional: install with `uv sync --group
# postgres`. Without it, a postgresql:// HARRIER_DATABASE_URL is refused with
# that instruction, and the local SQLite store is unaffected (spec 103).
postgres = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harrier", "src/harrier_api", "src/harrier_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# System prompts are parity text from the old repo; long lines stay.
"src/harrier/resume/ai.py" = ["E501"]
"src/harrier/apply/answers.py" = ["E501"]
"src/harrier/apply/letters.py" = ["E501"]
"src/harrier/offers/evaluate.py" = ["E501"]
"src/harrier/outreach/drafts.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["harrier", "harrier_api", "harrier_cli"]
# Needed for the contract that names sklearn and numpy, which are not ours.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is API-free"
type = "forbidden"
source_modules = ["harrier"]
forbidden_modules = ["harrier_api", "harrier_cli"]

[[tool.importlinter.contracts]]
name = "LLM providers are reached only through the harrier.llm facade"
type = "forbidden"
source_modules = ["harrier", "harrier_api", "harrier_cli"]
forbidden_modules = ["harrier.llm.providers"]
ignore_imports = ["harrier.llm -> harrier.llm.providers"]

[[tool.importlinter.contracts]]
name = "sources are ingestion only"
type = "forbidden"
source_modules = ["harrier.sources"]
forbidden_modules = [
    "harrier.screening.rules",
    "harrier.screening.pipeline",
    "harrier.screening.archetypes",
    "harrier.screening.descriptions",
    "harrier.screening.seen",
    "harrier.screening.config",
    "harrier.tracker",
    # A learned score is scoring all the same: no source may reach it (spec 077).
    "harrier.scoring",
    # A source returns normalized jobs and does not know which track they land
    # in; the shared screening path decides that, once (spec 091).
    "harrier.tracks",
]

[[tool.importlinter.contracts]]
# Inference is plain Python over a JSON model (spec 077). The trainer is the
# one module allowed scikit-learn and numpy, which the image does not install.
name = "only the trainer imports scikit-learn or numpy"
type = "forbidden"
source_modules = ["harrier", "harrier_api", "harrier_cli"]
forbidden_modules = ["sklearn", "numpy"]
ignore_imports = ["harrier.scoring.train -> sklearn", "harrier.scoring.train -> numpy"]
