# CI runs the same just recipes as local `just check` (docs/quality-ci-plan.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # The Python gate is three parts that start together (spec 168): the static
  # checks, the tests as four shards, and a job under the name the
  # main-protection ruleset requires, which passes only if all of them did.
  check-python-static:
    name: Python static (ruff, pyright, import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v3
      - run: just check-python-static

  check-python-tests:
    name: Python tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      # One run shows every failing test, not only the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The Postgres store's tests run here (spec 103). Each shard has its own
    # server: the tests create roles server-wide, so shards cannot share one
    # (spec 168). GitHub sets CI=true, so
    # tests/pg_support.py fails the run, rather than skipping, when this
    # service is missing or unreachable (spec 039).
    services:
      postgres:
        # Supabase creates new projects on Postgres 17 (spec 103):
        # https://supabase.com/changelog/46080-self-hosted-supabase-upgrading-from-pg-15-to-17-breaking-change
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Tests start only after the server accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway CI database, not a credential.
      HARRIER_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HARRIER_TEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v3
      # The hosted backup's tests run pg_dump and pg_restore against the
      # Postgres 17 service, and the runner's own client is older than the
      # server, which pg_dump refuses. The encryption tests need age
      # (spec 153, amended in the change that built it).
      - name: Install the PostgreSQL 17 client and age
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17 age
      - run: just check-python-tests

  check-python:
    name: Python (ruff, pyright, import-linter, pytest)
    needs: [check-python-static, check-python-tests]
    # Runs when a part failed or was cancelled too: a skipped required check
    # reads as passing, and a part that did not run has not passed.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Python job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::not every Python job passed"
            echo "$failed"
            exit 1
          fi

  check-ts:
    name: TypeScript (tsc, eslint, prettier, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: extractions/setup-just@v3
      - run: just check-ts

  contract-drift:
    name: Contract codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: extractions/setup-just@v3
      - run: pnpm install --frozen-lockfile
      - run: just contract
      - name: Fail on drift
        run: git diff --exit-code packages/contract

  aie-check:
    name: Governance drift (aie check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact release that package.json installs, so CI and the
      # local aie check compile with the same compiler (spec 089).
      - uses: akin-oz/ai-engineering@v0.6.2

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI directly, not gitleaks-action: the action derives a commit range from
      # the event payload and errors on a root-commit push. A full-history scan is
      # deterministic and uses the same .gitleaks.toml as pre-commit.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks detect --redact --no-banner
