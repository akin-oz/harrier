# Governance mirror: the local commit contract, made provable in the PR tab.
# Every commit's Spec: NNN trailer must resolve to a spec with approved: yes.
# Mechanics adapted from Sorrel's spec-gate.yml.
name: Spec gate

on:
  pull_request:
    branches: [main]

jobs:
  spec-trailer:
    name: Commits reference an approved spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # The logic lives in scripts/spec_gate.py so it can be tested against
        # real repositories rather than only observed in CI (spec 039). It
        # resolves approval from the BASE tree, because reading it from the
        # checked-out pull request let a branch approve its own spec.
        run: python3 scripts/spec_gate.py . "$BASE" "$HEAD"

  spec-structure:
    name: Specs carry their required headings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A spec that loses a section loses the findings it held, and neither
      # the trailer gate nor the artifact check reads structure (spec 041).
      - run: python3 scripts/check_spec_structure.py specs
