# The staging API on Fly (spec 110, ADR-013). Public: it holds no secret.
#
# The image is not built here. `deploy.yml` builds the `hosted` target of the
# Dockerfile once and runs `fly deploy --image <digest> --config
# deploy/fly.staging.toml`. Secrets are Fly secrets set once by the operator
# (docs/deploy.md): HARRIER_DATABASE_URL, HARRIER_RUN_DATABASE_URL and
# HARRIER_CREDENTIALS_KEY. None of them is in this file, and no TELEGRAM_ or
# GMAIL_ variable belongs in it or in a secret: the hosted API refuses to
# start with one (spec 109).
#
# HARRIER_SUPABASE_URL and HARRIER_SUPABASE_PUBLISHABLE_KEY name the operator's
# Supabase project, so this file carries a placeholder for each and the deploy
# writes the project's values into a copy before `fly deploy` reads it
# (`harrier deploy fill-fly-config`). Both values are public in the SPA's
# bundle; they are kept out of the repository so a fork deploys its own
# project from the same file. HARRIER_AUTH, HARRIER_ALLOWED_HOSTS and
# HARRIER_CORS_ORIGINS name no project and stay as written.
app = "harrier-api-staging"
primary_region = "ams"

# The signal and the wait before the second one: the API ends its runs as
# interrupted before the machine stops (spec 106; spec 115, F2).
kill_signal = "SIGTERM"
kill_timeout = 30

[env]
  HARRIER_AUTH = "supabase"
  HARRIER_SUPABASE_URL = "__HARRIER_SUPABASE_URL__"
  HARRIER_SUPABASE_PUBLISHABLE_KEY = "__HARRIER_SUPABASE_PUBLISHABLE_KEY__"
  HARRIER_ALLOWED_HOSTS = "harrier-api-staging.fly.dev"
  HARRIER_CORS_ORIGINS = "https://harrier-web-staging.vercel.app"

# One machine, stopped when idle and started by the next request (hosting
# budget, spec 110). Exactly one: a second needs fly-replay routing first
# (spec 106), and the deploy counts the machines.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Fly's check sends no Host the API would accept unless it is told one:
  # the trusted-host check of spec 104 answers 400 to any other name.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

    [http_service.checks.headers]
      Host = "harrier-api-staging.fly.dev"

# The image carries Chromium and poppler for PDFs, which is why it is 1GB.
# 512MB is untested with Chromium (spec 115, F5).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
